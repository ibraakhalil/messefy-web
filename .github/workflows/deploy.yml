name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and push backend image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/messefy-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and push frontend image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/messefy-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://80.225.215.51:5555' }}

  deploy:
    name: Deploy to Remote Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # 1. Ensure deployment directory exists on the server
      - name: Ensure Target Directory Exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE || '' }}
          script: |
            mkdir -p ~/messefy-web

      # 2. Copy updated production docker-compose file to the server
      - name: Copy docker-compose.prod.yml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE || '' }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/messefy-web"

      # 3. Pull latest images and restart containers on the server
      - name: Pull and Run Containers via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE || '' }}
          envs: OWNER_LC,GITHUB_ACTOR
          script: |
            set -e
            cd /home/ubuntu/messefy-web

            # Check if .env exists
            if [ ! -f .env ]; then
              echo "⚠️ WARNING: .env file not found in /home/ubuntu/messefy-web! Please create it from .env.production.example"
            fi

            # Login to GHCR to pull packages
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull latest images
            IMAGE_OWNER="$OWNER_LC" docker compose -f docker-compose.prod.yml pull

            # Start containers in background
            IMAGE_OWNER="$OWNER_LC" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old unused images to save disk space on 1GB server
            docker image prune -af --filter "until=24h"

            echo "✅ Deployment completed successfully!"
